name: 'Terraform Azure Deploy'

# 1. הגדרת הטריגרים: מתי ה-Pipeline ירוץ
on:
  push:
    branches: [ "main" ]         # ירוץ ויבצע Apply כשנכנס קוד ל-main
  pull_request:
    branches: [ "main" ]         # ירוץ ויבצע Plan בלבד כשפותחים PR

# 2. הרשאות נדרשות לכתיבת תגובות ב-PR
permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    
    # 3. הגדרת המשתנים ברמת ה-Job (התיקון הקריטי לשגיאה שלך)
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
    # 4. משיכת הקוד מהמאגר
    - name: Checkout
      uses: actions/checkout@v4

    # 5. התקנת Terraform על המכונה
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # 6. איתחול טרפורם (התחברות ל-Backend)
    - name: Terraform Init
      run: terraform init

    # 7. בדיקת השינויים (ירוץ תמיד - גם ב-PR וגם ב-Main)
    - name: Terraform Plan
      run: terraform plan -input=false

    # 8. ביצוע השינויים בפועל (ירוץ רק אחרי Merge ל-main)
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false