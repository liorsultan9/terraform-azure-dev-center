name: 'Terraform Azure Deploy'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ] # מפעיל בדיקות כשפותחים PR ל-main

permissions:
  contents: read
  pull-requests: write # מאפשר ל-Terraform לכתוב תגובה בתוך ה-PR

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init

    # הרצת Plan תמיד תקרה (גם ב-PR וגם ב-Main)
    - name: Terraform Plan
      run: terraform plan -input=false

    # הרצת Apply תקרה רק אם אנחנו על ענף main (כלומר אחרי ה-Merge)
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false
      